<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d"><title>MovieHub 2.0</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#08090d;--panel:#11131a;--text:#f5f7fb;--muted:#9aa0ad;--accent:#e50914;--line:#252936}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(8,9,13,.94);backdrop-filter:blur(14px);padding:16px;border-bottom:1px solid var(--line)}
.logo{font-size:25px;font-weight:800}.logo span{color:var(--accent)}
.search{margin-top:13px;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#171922;color:white;font-size:16px;outline:none}
main{padding:18px 16px 95px;max-width:1100px;margin:auto}.hero{border-radius:20px;padding:24px 20px;background:linear-gradient(135deg,#252936,#0d0e13);min-height:190px;display:flex;flex-direction:column;justify-content:end;margin-bottom:22px}
.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:#c0c5d0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:var(--accent);color:#fff;margin-top:15px;width:max-content}
.section{margin:23px 0}.section h2{font-size:20px;margin:0 0 12px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:#12141b;color:#ddd;padding:9px 13px;border-radius:999px}.chip.active{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line)}.poster{height:190px;background:linear-gradient(145deg,#343846,#171922);display:flex;align-items:end;padding:12px;font-weight:800}.meta{padding:11px}.title{font-weight:700}.small{color:var(--muted);font-size:12px;margin-top:4px}.card button{margin:9px 11px 12px;width:calc(100% - 22px);padding:9px;border:0;border-radius:9px;background:#262a35;color:white;font-weight:700}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(12,13,18,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#aeb3bf;font-size:12px}nav b{display:block;font-size:19px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:20;padding:55px 12px 20px;overflow:auto}.modalbox{max-width:700px;margin:auto;background:#101219;border:1px solid var(--line);border-radius:18px;padding:18px}.close{float:right;background:none;color:white;border:0;font-size:25px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.poster{height:240px}}
</style></head><body>
<header><div class="logo">Movie<span>Hub</span></div><input id="search" class="search" placeholder="Search movies, shows & anime…"></header>
<main><section class="hero"><h1>Watch. Discover. Go.</h1><p>A cinematic library for movies, TV and anime.</p><button class="btn" onclick="render()">Browse Library</button></section>
<section class="section"><h2>Genres</h2><div id="chips" class="chips"></div></section>
<section class="section"><h2>Popular Picks</h2><div id="grid" class="grid"></div></section>
<section class="section"><h2>Free Streaming</h2><div class="empty">MovieHub can open legitimate free catalogs such as Plex. Availability varies by country.</div></section></main>
<nav><button onclick="render()"><b>⌂</b>Home</button><button onclick="focusSearch()"><b>⌕</b>Search</button><button onclick="openInfo('My List','Your watchlist can be added in the next update.')"><b>♡</b>My List</button><button onclick="openInfo('Downloads','Offline downloads work only for videos whose source permits downloading. Plex free Movies & Shows does not permit offline downloads.')"><b>⇩</b>Downloads</button></nav>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="detail"></div></div></div>
<script>
const genres=["All","Action","Anime","Horror","Sci‑Fi","Comedy","Animation","Drama","Thriller"];
const items=[
["Heat","1995","Action","Free on Plex","https://watch.plex.tv/"],
["Godzilla","1998","Action","Free on Plex","https://watch.plex.tv/"],
["Snatch","2000","Crime","Free on Plex","https://watch.plex.tv/"],
["Wrong Turn","2003","Horror","Free on Plex","https://watch.plex.tv/"],
["Hannibal","TV","Drama","Free on Plex","https://watch.plex.tv/"],
["Into the Badlands","TV","Action","Free on Plex","https://watch.plex.tv/"],
["The Ark","TV","Sci‑Fi","Free on Plex","https://watch.plex.tv/"],
["Veronica Mars","TV","Drama","Free on Plex","https://watch.plex.tv/"],
["Nikita","TV","Action","Free on Plex","https://watch.plex.tv/"],
["The Terror","TV","Horror","Free on Plex","https://watch.plex.tv/"],
["My Little Pony: Friendship Is Magic","TV","Animation","Free on Plex","https://watch.plex.tv/"],
["Sands of Iwo Jima","1949","Action","Free on Plex","https://watch.plex.tv/"],
["Big Buck Bunny","2008","Animation","Authorized sample video","https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4"],
["Sintel","2010","Animation","Authorized sample video","https://media.w3.org/2010/05/sintel/trailer.mp4"]
];
let active="All"; const chips=document.getElementById("chips"),grid=document.getElementById("grid"),search=document.getElementById("search");
genres.forEach(g=>{let b=document.createElement("button");b.className="chip"+(g==="All"?" active":"");b.textContent=g;b.onclick=()=>{active=g;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};chips.appendChild(b)});
function render(){let q=search.value.toLowerCase();let a=items.filter(x=>(active==="All"||x[2]===active)&&x.join(" ").toLowerCase().includes(q));grid.innerHTML=a.map((x)=>`<article class="card"><div class="poster">${x[0]}</div><div class="meta"><div class="title">${x[0]}</div><div class="small">${x[1]} • ${x[2]}</div></div><button onclick="details(${items.indexOf(x)})">View</button></article>`).join("")||'<div class="empty">No titles found.</div>'}
function details(i){let x=items[i];document.getElementById("detail").innerHTML=`<h1>${x[0]}</h1><p class="small">${x[1]} • ${x[2]}</p><p>${x[3]}</p><button class="btn" onclick="window.open('${x[4]}','_blank')">Open Official Source</button>`;document.getElementById("modal").style.display="block"}
function openInfo(t,p){document.getElementById("detail").innerHTML=`<h2>${t}</h2><p class="small">${p}</p>`;document.getElementById("modal").style.display="block"}
function closeModal(){document.getElementById("modal").style.display="none"} function focusSearch(){search.focus();scrollTo(0,0)}
search.addEventListener("input",render);render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
